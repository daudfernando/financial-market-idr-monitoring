# Optional streaming services; combine with compose.yaml and profile streaming.
services:
  kafka-init:
    image: apache/kafka:3.9.1
    profiles: [streaming]
    user: "0:0"
    entrypoint: ["chown", "1000:1000", "/tmp/kraft-combined-logs"]
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
  kafka:
    image: apache/kafka:3.9.1
    profiles: [streaming]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, kafka:19092, --list]
      interval: 10s
      timeout: 10s
      retries: 12
  market:
    profiles: [streaming]
    build: ./streaming
    command: ["producer.py", "--help"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      GOOGLE_APPLICATION_CREDENTIALS: /workspace/gcp/adc.json
      GOOGLE_CLOUD_PROJECT: jcdeah-009
    volumes:
      - ./streaming:/workspace/streaming:ro
      - ./data:/workspace/data
      - ./tests:/workspace/tests:ro
      - ./deployment:/workspace/deployment:ro
      - ./config:/workspace/config:ro
      - type: bind
        source: ${GCP_ADC_PATH:?Run scripts/prepare_airflow.py first}
        target: /workspace/gcp/adc.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      kafka:
        condition: service_healthy
volumes:
  kafka-data:
